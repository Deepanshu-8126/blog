name: UniqueDigit 24/7 Autonomous Radar & Deals Pipeline

'on':
  push:
    branches:
      - main
    paths-ignore:
      - 'sarkari_seen_cache.json'
      - 'sent_loot_cache.json'
      - '.keep_alive'
      - 'docs/**'
  schedule:
    # Runs twice an hour on uncongested minute marks (24/7 Cloud Autopilot across all 13 niches)
    - cron: '17,47 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [auto-sync, hourly-radar]

concurrency:
  group: daily-radar
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run-radar-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Setup Node.js (for Wrangler D1 CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          npm install -g wrangler

      - name: Master Sentinel Pre-Flight Audit
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AMAZON_ASSOCIATE_TAG: "uniquedigi0c6-21"
          EARNKARO_USER_ID: "3360368"
          MEESHO_CREATOR_ID: "374453404"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'cf1a42fb306054063805cf459fddf853' }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID || '61d1d46f-f438-47f5-9128-516d9beb11cb' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: |
          echo "🛡️ Master Sentinel: Running Autonomous Quality & Security Audit..."
          python pipelines/master_sentinel_agent.py

      - name: Execute Multi-Source Trend Radar & Publish Live to D1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'cf1a42fb306054063805cf459fddf853' }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID || '61d1d46f-f438-47f5-9128-516d9beb11cb' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-3.5-flash-lite"
          AMAZON_ASSOCIATE_TAG: "uniquedigi0c6-21"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PORTAL_BASE_URL: "https://uniquedigit-viral-hub.pages.dev"
          POSTS_PER_NICHE: "2"
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_DEALS_BLOG_ID: ${{ secrets.BLOGGER_DEALS_BLOG_ID || '834082955272949961' }}
          BLOGGER_EXAM_BLOG_ID: ${{ secrets.BLOGGER_EXAM_BLOG_ID || '1366151638291560024' }}
          BLOGGER_AI_BLOG_ID: ${{ secrets.BLOGGER_AI_BLOG_ID || '2280231208480007821' }}
          BLOGGER_VIRAL_BLOG_ID: ${{ secrets.BLOGGER_VIRAL_BLOG_ID || '994918898669726760' }}
          BLOGGER_MOVIES_BLOG_ID: ${{ secrets.BLOGGER_MOVIES_BLOG_ID || '3174478771856373198' }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: |
          echo "🔥 Running Newsroom Trend Ingestion & Editorial Blog Pipeline..."
          python pipeline.py

      - name: Auto-Sync All Pages to Search Engines (IndexNow Mass Submission)
        run: |
          echo "⚡ Submitting all new and existing pages to search engines..."
          python scripts/submit_indexnow.py

