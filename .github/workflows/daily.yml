name: UniqueDigit Level 3 Trend Radar & Automation Pipeline

on:
  schedule:
    # Runs every 4 hours automatically (Level 3 Radar)
    - cron: '0 */4 * * *'
  workflow_dispatch: # Allows 1-click manual trigger from GitHub Actions

jobs:
  run-radar-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Pipeline Dependencies
        run: |
          pip install -r requirements.txt

      - name: Execute Multi-Source Trend Radar & Publish to D1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-3.5-flash-lite"
          AMAZON_ASSOCIATE_TAG: "uniquedigi0c6-21"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PORTAL_BASE_URL: "https://dk-s.pages.dev"
          POSTS_PER_NICHE: "3"
        run: |
          python pipeline.py
