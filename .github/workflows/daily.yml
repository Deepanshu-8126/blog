name: UniqueDigit 24/7 Autonomous Radar Pipeline

on:
  schedule:
    # Runs every 2 hours 24/7 on auto-pilot
    - cron: '0 */2 * * *'
  workflow_dispatch: # Allows 1-click manual trigger anytime from GitHub Actions tab

jobs:
  run-radar-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Setup Node.js (for Wrangler D1 CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          npm install -g wrangler

      - name: Execute Multi-Source Trend Radar & Publish Live to D1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'cf1a42fb306054063805cf459fddf853' }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID || '61d1d46f-f438-47f5-9128-516d9beb11cb' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-3.5-flash-lite"
          AMAZON_ASSOCIATE_TAG: "uniquedigi0c6-21"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PORTAL_BASE_URL: "https://uniquedigit-viral-hub.pages.dev"
          POSTS_PER_NICHE: "2"
        run: |
          python pipeline.py

