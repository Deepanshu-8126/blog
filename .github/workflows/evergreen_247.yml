name: 🌲 System 2 - Evergreen Authority Guide Engine (24/7 Cloud)

'on':
  schedule:
    # Runs every 3 hours round-the-clock (8 guides per day across all 10 niches auto-balanced)
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      pillar:
        description: 'Pillar to run (auto | all | health | finance | career | lifehacks | real-estate | gadgets | recipes | sports | parenting | travel)'
        required: false
        default: 'auto'
      count:
        description: 'Number of guides to generate'
        required: false
        default: '1'

concurrency:
  group: evergreen-guide-engine
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run-evergreen-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 📦 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📥 Install Dependencies
        run: pip install -r requirements.txt --quiet

      - name: 🔄 Restore Evergreen Seen Cache
        uses: actions/cache@v4
        with:
          path: evergreen_seen_cache.json
          key: evergreen-seen-cache-${{ github.run_id }}
          restore-keys: |
            evergreen-seen-cache-

      - name: 🚀 Execute Evergreen Authority Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_EXAM_BLOG_ID: ${{ secrets.BLOGGER_EXAM_BLOG_ID }}
          BLOGGER_VIRAL_BLOG_ID: ${{ secrets.BLOGGER_VIRAL_BLOG_ID }}
          BLOGGER_DEALS_BLOG_ID: ${{ secrets.BLOGGER_DEALS_BLOG_ID }}
          PORTAL_BASE_URL: ${{ secrets.PORTAL_BASE_URL }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          PILLAR="${{ github.event.inputs.pillar || 'auto' }}"
          COUNT="${{ github.event.inputs.count || '1' }}"
          echo "Executing Evergreen Engine with Pillar: $PILLAR, Count: $COUNT"
          python pipelines/evergreen_authority_engine.py "$PILLAR" "$COUNT"

      - name: 💾 Commit Seen Cache (Prevent Duplicates Across Cloud Runs)
        if: always()
        run: |
          git config user.name "UniqueDigit Evergreen Bot"
          git config user.email "bot@uniquedigit.in"
          git add -f evergreen_seen_cache.json || true
          git diff --staged --quiet || git commit -m "chore(cache): update evergreen seen cache [skip ci]"
          git push || true
