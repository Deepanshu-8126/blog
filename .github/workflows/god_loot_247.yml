name: 24/7 God-Level Loot Engine (Unlimited Cloud)

'on':
  push:
    branches:
      - main
    paths-ignore:
      - 'sarkari_seen_cache.json'
      - 'sent_loot_cache.json'
      - '.keep_alive'
      - 'docs/**'
  schedule:
    # Runs every 30 minutes to ensure continuous cloud workers
    - cron: '*/30 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [loot-trigger, 247-radar]

concurrency:
  group: god-loot-247
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run-god-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 python-dotenv requests google-auth google-auth-oauthlib google-api-python-client

      - name: Run 24/7 God-Level Loot Engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '8594213665:AAHWPNHEzrC9ChpK5vqYyyy8fFkq1BgPCik' }}
          TELEGRAM_DEALS_CHANNEL: ${{ secrets.TELEGRAM_DEALS_CHANNEL || '@uniquedigit_deals' }}
          TELEGRAM_DEALS_GROUP_ID: ${{ secrets.TELEGRAM_DEALS_GROUP_ID || '-1004335990773' }}
          AMAZON_AFFILIATE_TAG: ${{ secrets.AMAZON_AFFILIATE_TAG || 'uniquedigi0c6-21' }}
          EARNKARO_USER_ID: ${{ secrets.EARNKARO_USER_ID || '3360368' }}
          MEESHO_CREATOR_ID: ${{ secrets.MEESHO_CREATOR_ID || '374453404' }}
          WHATSAPP_CHANNEL_URL: ${{ secrets.WHATSAPP_CHANNEL_URL || 'https://whatsapp.com/channel/0029Vb90gso4dTnKKpcf7M1E' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID || '61d1d46f-f438-47f5-9128-516d9beb11cb' }}
          DEALS_NICHE_ID: ${{ secrets.DEALS_NICHE_ID || '5cf8114c0bc3eb20c87ce3dcfc1ff185' }}
          BLOGGER_DEALS_BLOG_ID: ${{ secrets.BLOGGER_DEALS_BLOG_ID || '834082955272949961' }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: |
          # 30-minute (1800s) lightning scanner loop checking every 10 seconds for real-time deals
          python god_level_loot_engine.py --duration 1800 --interval 10

      - name: Sync Cache & Perpetuate 24/7 Loot Chain
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "UniqueDigit-Bot"
          git config --global user.email "bot@uniquedigit.internal"
          git add sent_loot_cache.json 2>/dev/null || true
          git commit -m "chore(loot): update sent deals cache [skip ci]" || true
          git push origin main || true
          # Self-dispatch the next continuous 30-minute cycle without waiting for cron
          echo "🔄 Chaining next autonomous 24/7 Loot cycle..."
          gh workflow run god_loot_247.yml || true
