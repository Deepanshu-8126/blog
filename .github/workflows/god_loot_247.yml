name: 24/7 God-Level Loot Engine (Unlimited Cloud)

'on':
  push:
    branches:
      - main
  schedule:
    # Runs every 30 minutes to ensure continuous overlapping cloud workers
    - cron: '*/30 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [loot-trigger, 247-radar]

concurrency:
  group: god-loot-247
  cancel-in-progress: false

jobs:
  run-god-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 python-dotenv

      - name: Run 24/7 God-Level Loot Engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '8594213665:AAHWPNHEzrC9ChpK5vqYyyy8fFkq1BgPCik' }}
          TELEGRAM_DEALS_CHANNEL: ${{ secrets.TELEGRAM_DEALS_CHANNEL || '@uniquedigit_deals' }}
          TELEGRAM_DEALS_GROUP_ID: ${{ secrets.TELEGRAM_DEALS_GROUP_ID || '-1004335990773' }}
          AMAZON_AFFILIATE_TAG: ${{ secrets.AMAZON_AFFILIATE_TAG || 'uniquedigi0c6-21' }}
          EARNKARO_USER_ID: ${{ secrets.EARNKARO_USER_ID || '3360368' }}
          MEESHO_CREATOR_ID: ${{ secrets.MEESHO_CREATOR_ID || '374453404' }}
          WHATSAPP_CHANNEL_URL: ${{ secrets.WHATSAPP_CHANNEL_URL || 'https://whatsapp.com/channel/0029Vb90gso4dTnKKpcf7M1E' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID || '61d1d46f-f438-47f5-9128-516d9beb11cb' }}
          DEALS_NICHE_ID: ${{ secrets.DEALS_NICHE_ID || '5cf8114c0bc3eb20c87ce3dcfc1ff185' }}
        run: |
          # Continuous ultra-fast 5s scanner loop for 1 hour (3600s) of non-stop real-time loot catching
          python god_level_loot_engine.py --duration 3600 --interval 5
