name: 24/7 Loot Radar — Real-Time Deal Intelligence

'on':
  schedule:
    # Every 5 minutes — much more aggressive than 15min
    # GitHub Actions minimum is 5 minutes, but combined with
    # multi-source scanning, this catches deals within minutes
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Scan mode'
        required: false
        default: 'normal'
        type: choice
        options:
          - normal
          - blitz

jobs:
  loot-radar:
    name: "🔍 Loot Radar Scan → @uniquedigit_deals"
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install requests python-dotenv

      - name: "🚀 Run Loot Radar Scan"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'cf1a42fb306054063805cf459fddf853' }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID || '61d1d46f-f438-47f5-9128-516d9beb11cb' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-3.5-flash-lite"
          AMAZON_ASSOCIATE_TAG: "uniquedigi0c6-21"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_DEALS_CHANNEL: "@uniquedigit_deals"
        run: |
          echo "🔍 Running Loot Radar one-shot scan..."
          python loot_radar_agent.py
