name: "🎯 BLITZ: Festival Sale Real-Time Radar"

# This workflow is designed for Big Billion Days, GIFD, Republic Day Sale, etc.
# It runs every 5 minutes but processes MORE deals per cycle and uses
# more aggressive search queries.

'on':
  workflow_dispatch:
    inputs:
      duration_hours:
        description: 'How many hours to keep blitz active (will auto-stop)'
        required: false
        default: '24'
        type: string

  # Can also be triggered by schedule during known sale periods
  # Uncomment during festival season:
  # schedule:
  #   - cron: '*/5 * * * *'

jobs:
  blitz-radar:
    name: "🎯 Festival Blitz Scan → @uniquedigit_deals"
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install requests python-dotenv

      - name: "🎯 Run Blitz Radar Scan"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'cf1a42fb306054063805cf459fddf853' }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID || '61d1d46f-f438-47f5-9128-516d9beb11cb' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-3.5-flash-lite"
          AMAZON_ASSOCIATE_TAG: "uniquedigi0c6-21"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_DEALS_CHANNEL: "@uniquedigit_deals"
        run: |
          echo "🎯 Running Festival BLITZ radar scan..."
          python loot_radar_agent.py
