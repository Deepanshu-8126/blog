name: 24/7 Sarkari Result & Scheme Radar

'on':
  push:
    branches:
      - main
    paths-ignore:
      - 'sarkari_seen_cache.json'
      - 'sent_loot_cache.json'
      - '.keep_alive'
      - 'docs/**'
  schedule:
    # Runs twice an hour on offset minutes :07 and :37 to catch breaking Sarkari results
    - cron: '7,37 * * * *'
  workflow_dispatch:

concurrency:
  group: sarkari-radar
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run-sarkari-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Master Sentinel Pre-Flight Audit
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AMAZON_ASSOCIATE_TAG: "uniquedigi0c6-21"
          EARNKARO_USER_ID: "3360368"
          MEESHO_CREATOR_ID: "374453404"
          BLOGGER_EXAM_BLOG_ID: ${{ secrets.BLOGGER_EXAM_BLOG_ID || '1366151638291560024' }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'cf1a42fb306054063805cf459fddf853' }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID || '61d1d46f-f438-47f5-9128-516d9beb11cb' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "🛡️ Master Sentinel: Running Autonomous Quality & Security Audit..."
          python pipelines/master_sentinel_agent.py

      - name: Run Sarkari Radar Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
          BLOGGER_EXAM_BLOG_ID: ${{ secrets.BLOGGER_EXAM_BLOG_ID || '1366151638291560024' }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'cf1a42fb306054063805cf459fddf853' }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID || '61d1d46f-f438-47f5-9128-516d9beb11cb' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python pipelines/sarkari_radar_engine.py 3

      - name: Cache Sarkari Seen Radar Data
        if: always()
        uses: actions/cache@v4
        with:
          path: sarkari_seen_cache.json
          key: sarkari-radar-cache-${{ github.run_id }}
          restore-keys: |
            sarkari-radar-cache-
